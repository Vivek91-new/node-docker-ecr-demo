name: Deploy Node.js App to EC2

on:
  push:
    branches:
      - main
      - dev
      - qa

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: ecr-repo1

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build Docker image
      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .

      # 5. Push Docker image to ECR
      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # 6. Deploy image to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ env.AWS_REGION }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,AWS_REGION
          script: |
            set -e

            echo "================================"
            echo "Starting deployment"
            echo "================================"

            echo "Logging in to ECR..."
            aws ecr get-login-password --region $AWS_REGION | \
              docker login --username AWS --password-stdin $ECR_REGISTRY

            echo "Pulling new Docker image..."
            docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

            # Stop and remove old containers if they exist
            docker stop node-app-dev || true
            docker rm node-app-dev || true
            docker stop node-app-qa || true
            docker rm node-app-qa || true
            docker stop node-app || true
            docker rm node-app || true

            # Branch-based deployment
            if [ "${GITHUB_REF##*/}" = "dev" ]; then
              echo "Deploying DEV branch..."
              docker run -d \
                --name node-app-dev \
                --restart unless-stopped \
                -p 3001:3000 \
                -e ENV=DEV \
                $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
            elif [ "${GITHUB_REF##*/}" = "qa" ]; then
              echo "Deploying QA branch..."
              docker run -d \
                --name node-app-qa \
                --restart unless-stopped \
                -p 3002:3000 \
                -e ENV=QA \
                $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
            else
              echo "Deploying MAIN branch..."
              docker run -d \
                --name node-app \
                --restart unless-stopped \
                -p 3000:3000 \
                -e ENV=MAIN \
                $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
            fi

            echo "Checking container status..."
            docker ps

            echo "Checking application..."
            sleep 5

            curl -f http://localhost:3000 || true
            curl -f http://localhost:3001 || true
            curl -f http://localhost:3002 || true

            echo "================================"
            echo "Deployment successful"
            echo "================================"
